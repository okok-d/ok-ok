<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>okok</title>

    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
        try {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
        } catch (e) {
            document.documentElement.dataset.theme = "light";
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>OkOK</h1>
            <p>OkOk</p>
        </div>
        <button id="themeToggle">🌙 Dark</button>
    </header>

    <main>

        <!-- Account area -->
        <section id="authArea">

            <div id="signupArea">
                <h2>Create account</h2>

                <input
                    id="signupUsername"
                    type="text"
                    maxlength="20"
                    placeholder="Username"
                    autocomplete="username"
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password (at least 8 characters)"
                    autocomplete="new-password"
                >

                <button id="signupButton">Create account</button>

                <p>
                    Already have an account?
                    <a href="#" id="showLogin">Log in</a>
                </p>
            </div>

            <div id="loginArea" hidden>
                <h2>Log in</h2>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button id="loginButton">Log in</button>

                <p>
                    Need an account?
                    <a href="#" id="showSignup">Create one</a>
                </p>
            </div>

        </section>

        <!-- Logged-in area -->
        <section id="chatArea" hidden>

            <div class="account-bar">
                <span id="currentUser"></span>
                <button id="myProfileButton">My profile</button>
                <button id="logoutButton">Log out</button>
            </div>

            <div class="tabs">
                <button id="tabPublic" class="tab active">Public chat</button>
                <button id="tabDMs" class="tab">
                    Direct messages
                    <span id="dmBadge" class="badge" hidden></span>
                </button>
            </div>

            <!-- Public chat -->
            <div id="publicPanel">
                <div id="messages">
                    <p>Loading messages...</p>
                </div>

                <div class="input-area">
                    <input
                        id="message"
                        type="text"
                        maxlength="1000"
                        placeholder="Write a message..."
                        autocomplete="off"
                    >

                    <button id="sendButton">Send</button>
                </div>
            </div>

            <!-- Direct messages -->
            <div id="dmPanel" hidden>

                <div id="dmListView">
                    <div id="dmList"></div>
                </div>

                <div id="dmChatView" hidden>
                    <div class="dm-header">
                        <button id="dmBack">← Back</button>
                        <div id="dmHeaderAvatar" class="avatar"></div>
                        <strong id="dmHeaderName"></strong>
                    </div>

                    <div id="dmMessages"></div>

                    <div class="input-area">
                        <input
                            id="dmInput"
                            type="text"
                            maxlength="1000"
                            placeholder="Write a private message..."
                            autocomplete="off"
                        >

                        <button id="dmSendButton">Send</button>
                    </div>
                </div>

            </div>

        </section>

        <p id="status">Connecting...</p>

    </main>

    <!-- Profile modal -->
    <div id="profileModal" class="modal" hidden>
        <div class="modal-card">
            <button id="closeProfile" class="close">✕</button>

            <div id="profileAvatar" class="avatar big"></div>
            <h2 id="profileName"></h2>
            <p id="profileBio"></p>

            <button id="messageButton" hidden>Message</button>

            <div id="profileEdit" hidden>
                <input
                    id="avatarFile"
                    type="file"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                >

                <textarea
                    id="bioInput"
                    maxlength="300"
                    placeholder="Write a bio (300 characters max)"
                ></textarea>

                <button id="saveProfile">Save profile</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
